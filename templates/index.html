<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prize Automation Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.3rem; margin-bottom: 0.25rem; color: #f0f6fc; }
    .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .run-btn {
      background: #238636;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.6rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 1.5rem;
    }
    .run-btn:hover:not(:disabled) { background: #2ea043; }
    .run-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .stop-btn {
      background: #a31621;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.6rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 1.5rem;
    }
    .stop-btn:hover:not(:disabled) { background: #da3633; }
    .stop-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .actions { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    .actions button { margin-bottom: 0; }
    .live-panel {
      width: 100%;
      max-width: 820px;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .live-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #30363d;
      font-size: 0.8rem;
      color: #c9d1d9;
      font-weight: 600;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #30363d; }
    .live-dot.on { background: #3fb950; box-shadow: 0 0 6px rgba(63, 185, 80, 0.6); }
    .live-hint { margin-left: auto; font-weight: 400; color: #8b949e; }
    .live-body {
      height: 340px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .live-img { max-width: 100%; max-height: 100%; display: block; }
    .live-idle { color: #8b949e; font-size: 0.85rem; padding: 0 1rem; text-align: center; }
    .console {
      width: 100%;
      max-width: 820px;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      height: 38vh;
      overflow-y: auto;
      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .console .line.ok { color: #3fb950; }
    .console .line.warn { color: #d29922; }
    .console .line.info { color: #79c0ff; }
    .console .line.result { color: #ff7b72; font-weight: 700; }
    .status { margin-top: 1rem; color: #8b949e; font-size: 0.85rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active { background: #238636; border-color: #238636; color: #fff; }
    .hidden { display: none !important; }
    .bills {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .bill-card {
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 0.5rem;
      width: 260px;
      cursor: zoom-in;
    }
    .bill-card:hover { border-color: #238636; }
    .bill-card img { width: 100%; border-radius: 4px; display: block; }
    .bill-name { color: #8b949e; font-size: 0.8rem; text-align: center; margin-top: 0.4rem; }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border: 1px solid #30363d;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .lightbox-close {
      position: fixed;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #c9d1d9;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1001;
      line-height: 1;
    }
    .lightbox-close:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>Prize Automation Console</h1>
  <div class="sub">Runs auto_challenge.py (same optimized startup as the CLI), streams the browser to the Live View panel, and mirrors its output here.</div>
  <div class="tabs">
    <button id="tabRun" class="tab active">Run</button>
    <button id="tabBills" class="tab">Your Bills</button>
  </div>
  <div id="viewRun">
    <div class="actions">
      <button id="runBtn" class="run-btn">Run Automation</button>
      <button id="stopBtn" class="stop-btn" disabled>Stop</button>
    </div>
    <div class="live-panel">
      <div class="live-head">
        <span id="liveDot" class="live-dot"></span>Live View
        <span id="liveHint" class="live-hint">idle</span>
      </div>
      <div class="live-body">
        <img id="liveImg" class="live-img hidden" alt="Live automation view">
        <div id="liveIdle" class="live-idle">Waiting for a run &mdash; press &ldquo;Run Automation&rdquo;.</div>
      </div>
    </div>
    <div id="console" class="console"><span class="line info">[console] Ready. Click "Run Automation" to start.</span></div>
    <div id="status" class="status">Status: idle</div>
  </div>
  <div id="viewBills" class="hidden">
    <div id="bills" class="bills"><span class="line info">Loading bills...</span></div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightboxClose" class="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightboxImg" src="" alt="Screenshot">
  </div>

  <script>
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const consoleEl = document.getElementById('console');
    const statusEl = document.getElementById('status');
    const tabRun = document.getElementById('tabRun');
    const tabBills = document.getElementById('tabBills');
    const viewRun = document.getElementById('viewRun');
    const viewBills = document.getElementById('viewBills');
    const billsEl = document.getElementById('bills');
    let pos = 0;
    let pollTimer = null;
    let billsTimer = null;
    let lastBillsKey = null;

    const liveDot = document.getElementById('liveDot');
    const liveHint = document.getElementById('liveHint');
    const liveImg = document.getElementById('liveImg');
    const liveIdle = document.getElementById('liveIdle');
    let liveAttached = false;

    function showLive(on) {
      if (on && !liveAttached) {
        liveAttached = true;
        liveImg.src = '/live';
        liveIdle.classList.add('hidden');
        liveImg.classList.remove('hidden');
        liveHint.textContent = 'connecting\u2026';
        liveDot.classList.add('on');
      } else if (!on && liveAttached) {
        liveAttached = false;
        liveImg.removeAttribute('src');
        liveImg.classList.add('hidden');
        liveIdle.classList.remove('hidden');
        liveHint.textContent = 'idle';
        liveDot.classList.remove('on');
      }
    }

    liveImg.addEventListener('load', () => {
      if (liveAttached) liveHint.textContent = 'streaming';
    });
    liveImg.addEventListener('error', () => {
      if (liveAttached) liveHint.textContent = 'reconnecting\u2026';
    });

    function styleLine(text) {
      if (text.includes('RESULT:') || text.includes('SUB MIT')) return 'result';
      if (text.includes('[+]') || text.includes('filled')) return 'ok';
      if (text.includes('[!]')) return 'warn';
      return 'info';
    }

    function appendLines(lines) {
      for (const line of lines) {
        const div = document.createElement('div');
        div.className = 'line ' + styleLine(line);
        div.textContent = line;
        consoleEl.appendChild(div);
      }
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function pollLog() {
      const res = await fetch(`/log?pos=${pos}`);
      const data = await res.json();
      if (data.lines.length) {
        appendLines(data.lines);
        pos = data.pos;
      }
      const sres = await fetch('/status');
      const status = await sres.json();
      if (status.running) statusEl.textContent = 'Status: running...';
      else if (status.ready) statusEl.textContent = 'Status: idle (browser opens per run)';
      else statusEl.textContent = 'Status: idle (starting worker...)';
      runBtn.disabled = status.running;
      stopBtn.disabled = !status.running;
      showLive(status.running);
      if (status.running) {
        pollTimer = setTimeout(pollLog, 400);
      } else {
        clearTimeout(pollTimer);
      }
    }

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      statusEl.textContent = 'Status: stopping...';
      const res = await fetch('/stop', { method: 'POST' });
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = data.error;
        stopBtn.disabled = false;
      }
      pollTimer = setTimeout(pollLog, 400);
    });

    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true;
      consoleEl.innerHTML = '';
      pos = 0;
      statusEl.textContent = 'Status: starting...';
      const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = data.error;
        runBtn.disabled = false;
        return;
      }
      pollTimer = setTimeout(pollLog, 400);
    });

    function switchTab(name) {
      if (name === 'bills') {
        tabRun.classList.remove('active');
        tabBills.classList.add('active');
        viewRun.classList.add('hidden');
        viewBills.classList.remove('hidden');
        loadBills(true);
      } else {
        tabBills.classList.remove('active');
        tabRun.classList.add('active');
        viewBills.classList.add('hidden');
        viewRun.classList.remove('hidden');
        clearTimeout(billsTimer);
      }
    }

    async function loadBills(force) {
      if (viewBills.classList.contains('hidden')) return;
      const res = await fetch('/bills');
      const data = await res.json();
      const key = JSON.stringify(data.bills.map(b => b.file));
      if (!force && key === lastBillsKey) {
        scheduleBills();
        return;
      }
      lastBillsKey = key;
      billsEl.innerHTML = '';
      if (!data.bills.length) {
        billsEl.innerHTML = '<span class="line info">No bills yet. Run the automation to generate a screenshot.</span>';
      } else {
        for (const b of data.bills) {
          const card = document.createElement('div');
          card.className = 'bill-card';
          const img = document.createElement('img');
          img.src = '/ss/' + encodeURIComponent(b.file);
          img.alt = b.name;
          img.loading = 'lazy';
          img.addEventListener('click', () => openLightbox(img.src));
          const cap = document.createElement('div');
          cap.className = 'bill-name';
          cap.textContent = b.name;
          card.appendChild(img);
          card.appendChild(cap);
          billsEl.appendChild(card);
        }
      }
      scheduleBills();
    }

    function scheduleBills() {
      clearTimeout(billsTimer);
      billsTimer = setTimeout(() => loadBills(false), 3000);
    }

    tabRun.addEventListener('click', () => switchTab('run'));
    tabBills.addEventListener('click', () => switchTab('bills'));

    // Keep the console fresh even while idle (e.g. page reload).
    pollLog();
  </script>
</body>
</html>
